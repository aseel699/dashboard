<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>الصفحة قيد الصيانة</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
    font-family:'Tajawal','Segoe UI',Arial,sans-serif;
    background:#1a1a1a;
    color:#f2f2f2;
    text-align:center;
    padding:24px;
  }
  .wrap{max-width:440px}
  .icon{font-size:48px;margin-bottom:20px;opacity:.9}
  h1{font-size:26px;font-weight:800;margin-bottom:12px;color:#ffffff}
  p{font-size:15.5px;line-height:1.7;color:#b8b8b8}
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">🛠️</div>
    <h1>الصفحة قيد الصيانة</h1>
    <p>نعمل حاليًا على تحديث هذه الصفحة. يرجى المحاولة مرة أخرى لاحقًا.</p>
  </div>
</body>
</html>
